<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade de História | Análise de Iconografia</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuração Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            museum: {
              900: '#0f172a',
              800: '#1e293b',
              gold: '#d97706',
              light: '#f8fafc',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  
  <!-- Bibliotecas React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e2e8f0' fill-opacity='0.5'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    
    /* Scrollbars elegantes para PC e Telemóvel */
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .dark-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .dark-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    .dark-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SCHOOL_LOGO_URL = "https://i.ibb.co/Df0wxYjb/Design-sem-nome-5-removebg-preview.png";
    const IMAGE_URL = "https://i.ibb.co/RGtcdfVC/onhb.jpg";

    // --- DADOS ALEATORIZADOS (Fim do padrão 1=A, 2=B) ---
    // As letras foram reatribuídas de forma aleatória mas estática para evitar que os alunos adivinhem
    const hints = [
      { letter: 'A', text: 'Vemos antes embarcações que realizam uma Romaria Marítima, manifestação religiosa católica na qual fiéis percorrem rios ou o mar em barcos enfeitados.' },
      { letter: 'B', text: 'A vegetação é composta por árvores frondosas representadas de forma simétrica.' },
      { letter: 'C', text: 'Várias barracas são avistadas, provavelmente montadas para o conforto e descanso dos romeiros.' },
      { letter: 'D', text: 'Há três pessoas negras num barco e duas delas parecem executar uma apresentação com instrumentos de sopro.' },
      { letter: 'E', text: 'Há embarcações conduzidas por remadores brancos.' },
      { letter: 'F', text: 'Um grupo de homens negros desloca-se à frente de um grupo de homens a cavalo.' },
      { letter: 'G', text: 'Um homem desce um pequeno morro trazendo um objeto redondo nas suas mãos.' },
      { letter: 'H', text: 'Veículos de tração animal desatrelados são vistos na imagem.' },
      { letter: 'I', text: 'Um grupo de homens negros adestra cavalos de montaria.' }, // Distrator
      { letter: 'J', text: 'Todas as embarcações são conduzidas por remadores negros.' }, // Distrator
      { letter: 'K', text: 'Pessoas descansam junto a barracas, sob árvores e mesmo deitadas no chão.' },
      { letter: 'L', text: 'Ao fundo vêem-se colinas e montanhas.' },
      { letter: 'M', text: 'A obra “Romaria Marítima diante do Hospital dos Lázaros”, óleo sobre tela, 96 x 126 cm (oval), sem assinatura e sem data (provavelmente c.1790) é uma produção do pintor, cenógrafo e arquiteto Leandro Joaquim e pertence ao acervo do Museu Histórico Nacional.' },
      { letter: 'N', text: 'Embarcações apresentam tendas que têm a função de proteger os passageiros do sol, chuva e vento.' },
      { letter: 'O', text: 'Mulheres, provavelmente da elite, usam chapéus decorados com penas.' },
      { letter: 'P', text: 'Uma roda de moinho encontra-se próxima a uma construção e por elas passa um canal de água que deságua no mar.' },
      { letter: 'Q', text: 'Há embarcações maiores e ricamente decoradas e outras mais simples e menores.' },
      { letter: 'R', text: 'Identifica-se pessoas negras na imagem, especialmente homens a remar nas embarcações.' },
      { letter: 'S', text: 'Construções em alvenaria, edifícios e muros podem ser vistos entre a praia e o Hospital.' },
      { letter: 'T', text: 'Há grande número de bandeiras, especialmente brancas, vermelhas, brancas e vermelhas. Algumas trazem brasões.' },
      { letter: 'U', text: 'Pessoas protegem-se sob guarda-sóis.' },
      { letter: 'V', text: 'Pessoas aproximam-se do Hospital subindo aclives.' },
      { letter: 'W', text: 'Bandeiras são vistas tanto nas embarcações como em terra, especialmente nas cores verde e amarelo - cores da casa de Bragança.' }, // Distrator
      { letter: 'X', text: 'No alto de uma colina vê-se o Hospital dos Lázaros, um lazareto [instituição dedicada ao isolamento e tratamento de doentes com hanseníase].' },
      { letter: 'Y', text: 'Um jovem leva uma bola de couro para a festa que acontece mais abaixo.' }, // Distrator
      { letter: 'Z', text: 'Pode-se ver homens, mulheres e crianças na imagem, tanto nas embarcações como em terra.' }
    ];

    // Gabarito Oficial atualizado para coincidir com as novas letras aleatórias
    const officialAnswers = {
      1: 'M', 2: 'X', 3: 'A', 4: 'R', 5: 'C', 6: 'F', 7: 'Z', 8: 'H', 9: 'P', 10: 'K',
      11: 'L', 12: 'B', 13: 'Q', 14: 'D', 15: 'O', 16: 'E', 17: 'S', 18: 'T', 19: 'N',
      20: 'U', 21: 'V', 22: 'G'
    };

    const crumbsPositions = [
      { number: 1, left: 50.05, top: 9.54, study: "História da Arte Colonial, Leandro Joaquim e o Acervo." },
      { number: 2, left: 20.02, top: 28.97, study: "Lazaretos e isolamento de doentes no Brasil Colonial." },
      { number: 3, left: 50.05, top: 86.06, study: "Festividades católicas populares e Romarias Marítimas." },
      { number: 4, left: 64.94, top: 75.32, study: "Presença negra e escravidão no trabalho portuário colonial." },
      { number: 5, left: 52.37, top: 45.16, study: "Vida quotidiana e estruturas de abrigo em romarias." },
      { number: 6, left: 62.5, top: 37.49, study: "Relações de poder e trânsito social de diferentes etnias." },
      { number: 7, left: 42.24, top: 43.97, study: "Convivência geracional e de género nos eventos cívicos." },
      { number: 8, left: 38.82, top: 47.38, study: "Sistemas de transporte: Veículos de tração animal." },
      { number: 9, left: 26.46, top: 48.88, study: "Engenharia colonial: Rodas de moinho e canais." },
      { number: 10, left: 17.7, top: 47.38, study: "Quotidiano e ócio popular: O repouso e lazer." },
      { number: 11, left: 44.68, top: 28.97, study: "Análise de paisagem iconográfica e geografia." },
      { number: 12, left: 33.3, top: 39.74, study: "Representações de fauna e flora na pintura académica." },
      { number: 13, left: 42.24, top: 73.07, study: "Tipologia naval e distinções de prestígio." },
      { number: 14, left: 21.19, top: 71.95, study: "Expressões culturais afro-brasileiras e música." },
      { number: 15, left: 21.29, top: 48.5, study: "Indumentária e distinções de classe da elite." },
      { number: 16, left: 13.11, top: 63.63, study: "Análise do trabalho na pintura e remadores brancos." },
      { number: 17, left: 25.29, top: 42.84, study: "Arquitetura e urbanização colonial de alvenaria." },
      { number: 18, left: 49.27, top: 72.39, study: "Simbologias políticas: Bandeiras e brasões." },
      { number: 19, left: 46.92, top: 56.17, study: "Sistemas de proteção contra intempéries." },
      { number: 20, left: 57.13, top: 72.39, study: "Tecnologia e moda utilitária: Guarda-sóis." },
      { number: 21, left: 22.2, top: 36.12, study: "Caminhos sagrados e de romarias em aclives." },
      { number: 22, left: 13.6, top: 46.9, study: "Micro-histórias quotidianas em elementos figurativos." }
    ];

    const Icon = ({ path, className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={path}></path>
      </svg>
    );

    function App() {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('login'); 
      const [loading, setLoading] = useState(true);
      const [errorBanner, setErrorBanner] = useState('');
      
      // Controle de Zoom reestruturado para ser 100% responsivo
      const [zoomScale, setZoomScale] = useState(1);
      
      const [studentData, setStudentData] = useState({ name: '', shift: '', classRoom: '' });
      const [answers, setAnswers] = useState({});
      const [activeCrumb, setActiveCrumb] = useState(null);
      const [resultData, setResultData] = useState(null);

      useEffect(() => {
        const initFirebase = async () => {
          try {
            let config;
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
              config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            } else {
              config = {
                apiKey: "AIzaSyALUGZXbuWok-hzgdyiHXRA5Dl0kFtp5s8",
                authDomain: "atividade-natanel.firebaseapp.com",
                projectId: "atividade-natanel",
                storageBucket: "atividade-natanel.firebasestorage.app",
                messagingSenderId: "1032804060146",
                appId: "1:1032804060146:web:bdb86134e6ef63ff77396b"
              };
            }

            let appInstance = firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
            const authInstance = firebase.auth(appInstance);
            window.db = firebase.firestore(appInstance);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await authInstance.signInWithCustomToken(__initial_auth_token);
            } else {
              await authInstance.signInAnonymously();
            }

            const unsubscribe = authInstance.onAuthStateChanged((currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
            return unsubscribe;
          } catch (err) {
            console.error("Erro Firebase:", err);
            setLoading(false);
          }
        };

        let unsubscribeFn;
        initFirebase().then(unsub => { unsubscribeFn = unsub; });
        return () => { if (unsubscribeFn) unsubscribeFn(); };
      }, []);

      const handleStartQuiz = (e) => {
        e.preventDefault();
        if (studentData.name && studentData.shift && studentData.classRoom) {
          setErrorBanner('');
          setView('quiz');
          window.scrollTo(0, 0);
        }
      };

      const handleSelectAnswer = (crumbNumber, letter) => {
        const newAnswers = { ...answers };
        Object.keys(newAnswers).forEach(key => {
          if (newAnswers[key] === letter) delete newAnswers[key];
        });
        newAnswers[crumbNumber] = letter;
        setAnswers(newAnswers);
        setActiveCrumb(null);
      };

      const handleSubmitQuiz = async () => {
        if (!user) return;
        if (Object.keys(answers).length < crumbsPositions.length) {
          setErrorBanner(`Respondeu a ${Object.keys(answers).length} de ${crumbsPositions.length} pontos. Preencha todos antes de submeter!`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        setLoading(true);
        setErrorBanner('');
        
        let correctCount = 0;
        const details = crumbsPositions.map(crumb => {
          const userAnswer = answers[crumb.number];
          const correctAnswer = officialAnswers[crumb.number];
          const isCorrect = userAnswer === correctAnswer;
          if (isCorrect) correctCount++;
          return { crumbNumber: crumb.number, userAnswer, correctAnswer, isCorrect, studyTopic: isCorrect ? null : crumb.study };
        });
        
        const hitPercentage = Math.round((correctCount / crumbsPositions.length) * 100);
        const results = { correctCount, total: crumbsPositions.length, hitPercentage, errorPercentage: 100 - hitPercentage, details };
        
        setResultData(results);

        try {
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'atividade-natanel';
          if (window.db) {
            await window.db.collection(`artifacts/${appId}/public/data/respostas_alunos`).add({
              student: { name: studentData.name.trim(), shift: studentData.shift, classRoom: studentData.classRoom.trim() },
              answers: answers,
              score: results.correctCount,
              percentage: results.hitPercentage,
              timestamp: Date.now(),
              userId: user.uid
            });
          }
          
          setView('result');
          window.scrollTo(0, 0);
          if (results.hitPercentage >= 50) {
            confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 }, colors: ['#d97706', '#10b981', '#3b82f6'] });
          }
        } catch (error) {
          console.error(error);
          setErrorBanner("Erro de conexão ao guardar. Mostre o ecrã ao professor.");
          setView('result'); // Força a exibição mesmo se falhar a gravação
        } finally {
          setLoading(false);
        }
      };

      const progressCount = Object.keys(answers).length;
      const progressPercent = Math.round((progressCount / crumbsPositions.length) * 100);

      // Loading Screen
      if (loading && !user) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-museum-900 text-museum-gold">
            <div className="w-12 h-12 border-4 border-museum-gold border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="font-bold tracking-widest uppercase text-sm">A carregar exposição...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* HEADER RESPONSIVO */}
          <header className="bg-museum-900 text-white shadow-xl relative z-10 border-b-[6px] border-museum-gold sticky top-0">
            <div className="max-w-[1400px] mx-auto px-4 py-3 md:py-4 flex justify-between items-center">
              <div className="flex items-center gap-3 md:gap-5">
                <div className="bg-white/10 p-2 md:p-3 rounded-lg md:rounded-xl">
                  <Icon path="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" className="w-6 h-6 md:w-8 md:h-8 text-museum-gold" />
                </div>
                <div>
                  <h1 className="text-lg md:text-2xl font-bold font-serif leading-tight">Análise de Iconografia</h1>
                  <p className="text-xs md:text-sm text-slate-400 font-medium uppercase tracking-wider">Atividade de História</p>
                </div>
              </div>
              <div className="hidden sm:block bg-white rounded-md p-1">
                <img src={SCHOOL_LOGO_URL} alt="Logótipo" className="h-10 w-auto object-contain" onError={(e) => e.target.style.display='none'} />
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-[1400px] mx-auto w-full p-3 md:p-6 lg:p-8">
            
            {errorBanner && (
              <div className="mb-6 bg-red-100 border-l-4 border-red-500 p-4 rounded-r-lg shadow flex items-start gap-3 animate-fade-in">
                <Icon path="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" className="w-6 h-6 text-red-600 mt-0.5" />
                <p className="text-red-900 font-medium">{errorBanner}</p>
              </div>
            )}

            {/* ---------- TELA 1: LOGIN ---------- */}
            {view === 'login' && (
              <div className="animate-fade-in flex items-center justify-center py-10 md:py-16 relative">
                <div className="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-6 md:p-10 max-w-lg w-full relative z-10 border-t-4 border-t-museum-gold">
                  <div className="text-center mb-8">
                    <h2 className="text-2xl md:text-3xl font-serif font-bold text-museum-900 mb-2">Identificação do Aluno</h2>
                    <p className="text-slate-500 text-sm md:text-base">Preencha os dados para iniciar a análise histórica.</p>
                  </div>
                  
                  <form onSubmit={handleStartQuiz} className="space-y-4">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1">Nome Completo</label>
                      <input type="text" required value={studentData.name} onChange={(e) => setStudentData({...studentData, name: e.target.value})}
                        className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-museum-gold outline-none" placeholder="Ex: João Silva" />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Turma</label>
                        <input type="text" required value={studentData.classRoom} onChange={(e) => setStudentData({...studentData, classRoom: e.target.value})}
                          className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-museum-gold outline-none" placeholder="Ex: 8º A" />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Turno</label>
                        <select required value={studentData.shift} onChange={(e) => setStudentData({...studentData, shift: e.target.value})}
                          className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-museum-gold outline-none">
                          <option value="">Selecione...</option>
                          <option value="Manhã">Manhã</option>
                          <option value="Tarde">Tarde</option>
                          <option value="Noite">Noite</option>
                        </select>
                      </div>
                    </div>
                    <button type="submit" className="w-full mt-6 bg-museum-900 hover:bg-museum-800 text-white font-bold py-4 rounded-lg transition-colors flex justify-center items-center gap-2 text-lg">
                      Iniciar Análise <Icon path="M14 5l7 7m0 0l-7 7m7-7H3" className="w-5 h-5" />
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* ---------- TELA 2: QUIZ (Layout Dividido para PC e Empilhado para Mobile) ---------- */}
            {view === 'quiz' && (
              <div className="flex flex-col lg:flex-row gap-6 lg:gap-8 animate-fade-in items-start">
                
                {/* COLUNA ESQUERDA: A IMAGEM */}
                <div className="w-full lg:w-[65%] xl:w-[70%] flex flex-col gap-4">
                  
                  {/* Cabeçalho da Imagem */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex justify-between items-center">
                    <div>
                      <h2 className="text-xl md:text-2xl font-serif font-bold text-museum-900">A Obra em Análise</h2>
                      <p className="text-sm md:text-base text-slate-500 hidden md:block mt-1">
                        Clique nos marcadores (1 a 22) e associe o fragmento histórico correto.
                      </p>
                    </div>
                    
                    {/* Controlos de Zoom Modernos */}
                    <div className="flex items-center bg-slate-100 p-1.5 rounded-lg border border-slate-200">
                      <button onClick={() => setZoomScale(Math.max(1, zoomScale - 0.5))} className="p-2 text-slate-600 hover:bg-white hover:text-museum-900 rounded shadow-sm transition-all disabled:opacity-50" disabled={zoomScale <= 1}>
                        <Icon path="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0113 10H7" className="w-5 h-5" />
                      </button>
                      <span className="px-3 text-sm font-bold text-slate-700 select-none">{Math.round(zoomScale * 100)}%</span>
                      <button onClick={() => setZoomScale(Math.min(3, zoomScale + 0.5))} className="p-2 text-slate-600 hover:bg-white hover:text-museum-900 rounded shadow-sm transition-all disabled:opacity-50" disabled={zoomScale >= 3}>
                        <Icon path="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" className="w-5 h-5" />
                      </button>
                    </div>
                  </div>

                  {/* Contentor da Imagem Otimizado para Scroll e Zoom */}
                  <div className="bg-slate-900 rounded-2xl shadow-xl overflow-hidden border-[8px] md:border-[12px] border-[#3e2723] relative">
                    {/* Ajuda para Telemóvel */}
                    <div className="lg:hidden absolute top-2 right-2 z-10 bg-black/60 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-sm pointer-events-none">
                      <Icon path="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" className="w-4 h-4" />
                      Arraste para ver tudo
                    </div>

                    {/* A magia do Scroll Responsivo acontece aqui */}
                    <div className="overflow-auto w-full h-[60vh] lg:h-[75vh] dark-scrollbar">
                      <div 
                        className="relative transition-all duration-300 ease-out origin-top-left"
                        style={{ 
                          width: `${100 * zoomScale}%`, 
                          minWidth: '800px' // Força scroll horizontal em telemóveis se necessário, garantindo que a imagem nunca fique minúscula
                        }}
                      >
                        <img src={IMAGE_URL} alt="Pintura Colonial" className="w-full h-auto block select-none" draggable="false" />
                        
                        {/* Marcadores */}
                        {crumbsPositions.map((crumb) => {
                          const isAnswered = !!answers[crumb.number];
                          const letter = answers[crumb.number];
                          return (
                            <button
                              key={crumb.number}
                              onClick={() => setActiveCrumb(crumb)}
                              className={`absolute flex items-center justify-center font-bold shadow-xl transition-all duration-200 transform -translate-x-1/2 -translate-y-1/2
                                ${isAnswered ? 'bg-emerald-500 text-white border-2 border-white hover:scale-110 z-20' : 'bg-museum-gold text-white border-2 border-white animate-pulse-slow hover:scale-125 z-10'}`}
                              style={{ 
                                left: `${crumb.left}%`, 
                                top: `${crumb.top}%`,
                                // Mantém os marcadores num tamanho razoável mesmo quando há muito zoom
                                width: `${Math.max(28, 40 / zoomScale)}px`,
                                height: `${Math.max(28, 40 / zoomScale)}px`,
                                fontSize: `${Math.max(12, 16 / zoomScale)}px`,
                                borderRadius: '50%'
                              }}
                            >
                              {isAnswered ? letter : crumb.number}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>

                {/* COLUNA DIREITA: PROGRESSO E CHECKLIST */}
                <div className="w-full lg:w-[35%] xl:w-[30%] flex flex-col gap-4 sticky top-24">
                  
                  {/* Cartão de Progresso */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div className="flex justify-between items-end mb-3">
                      <div>
                        <h3 className="font-bold text-slate-800">O Seu Progresso</h3>
                        <p className="text-xs text-slate-500">Pontos associados</p>
                      </div>
                      <span className="text-2xl font-black text-museum-gold">{progressCount}<span className="text-base text-slate-400">/22</span></span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
                      <div className="bg-gradient-to-r from-amber-500 to-museum-gold h-full rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                  </div>

                  {/* Painel de Respostas (Checklist Compacto) */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-auto max-h-[40vh] lg:max-h-[50vh]">
                    <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 rounded-t-2xl">
                      <h4 className="font-bold text-sm text-slate-700 flex items-center gap-2 uppercase tracking-wide">
                        <Icon path="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" className="w-4 h-4 text-museum-gold" />
                        Grelha de Registo
                      </h4>
                    </div>
                    
                    <div className="p-4 overflow-y-auto custom-scrollbar">
                      <div className="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-4 gap-2">
                        {crumbsPositions.map((crumb) => {
                          const isAnswered = !!answers[crumb.number];
                          return (
                            <button
                              key={crumb.number}
                              onClick={() => setActiveCrumb(crumb)}
                              className={`flex flex-col items-center p-2 rounded-lg border transition-all ${
                                isAnswered
                                  ? 'bg-emerald-50 border-emerald-300 shadow-sm'
                                  : 'bg-white border-slate-200 hover:border-museum-gold hover:bg-amber-50'
                              }`}
                            >
                              <span className="text-[10px] font-bold text-slate-400 uppercase">P {crumb.number}</span>
                              <span className={`text-lg font-black ${isAnswered ? 'text-emerald-700' : 'text-slate-300'}`}>
                                {isAnswered ? answers[crumb.number] : '-'}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* Botão Submeter */}
                  <button 
                    onClick={handleSubmitQuiz}
                    disabled={loading || progressCount < crumbsPositions.length}
                    className={`w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 transition-all shadow-md
                      ${loading || progressCount < crumbsPositions.length 
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                        : 'bg-emerald-600 text-white hover:bg-emerald-700 hover:shadow-lg transform hover:-translate-y-0.5'}`}
                  >
                    {loading ? (
                      <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Gravando...</>
                    ) : (
                      <><Icon path="M5 13l4 4L19 7" /> Submeter Respostas</>
                    )}
                  </button>

                </div>
              </div>
            )}

            {/* ---------- MODAL DE SELEÇÃO (Otimizado para Mobile e PC) ---------- */}
            {activeCrumb && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 animate-fade-in">
                <div className="absolute inset-0 bg-slate-900/70 backdrop-blur-sm" onClick={() => setActiveCrumb(null)}></div>
                
                <div className="bg-white rounded-2xl md:rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] md:max-h-[85vh] flex flex-col relative z-10 animate-slide-up overflow-hidden">
                  
                  {/* Modal Header Fixo */}
                  <div className="bg-museum-900 text-white px-5 py-4 md:px-6 md:py-5 flex justify-between items-center flex-shrink-0">
                    <div className="flex items-center gap-3 md:gap-4">
                      <div className="bg-museum-gold w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold text-lg md:text-xl border-2 border-white/20 flex-shrink-0">
                        {activeCrumb.number}
                      </div>
                      <div>
                        <h4 className="text-lg md:text-xl font-serif font-bold leading-tight">Escolha o Fragmento</h4>
                        <p className="text-slate-300 text-xs md:text-sm mt-0.5">Qual frase descreve melhor este ponto?</p>
                      </div>
                    </div>
                    <button onClick={() => setActiveCrumb(null)} className="text-slate-400 hover:text-white p-2 bg-white/5 rounded-full transition-colors flex-shrink-0">
                      <Icon path="M6 18L18 6M6 6l12 12" />
                    </button>
                  </div>

                  {/* Lista de Opções (Scroll) */}
                  <div className="overflow-y-auto p-3 md:p-5 space-y-2 md:space-y-3 flex-grow custom-scrollbar bg-slate-50">
                    {hints.map((hint) => {
                      const alreadyUsedBy = Object.keys(answers).find(key => answers[key] === hint.letter);
                      const isCurrentSelection = answers[activeCrumb.number] === hint.letter;
                      const isUsedElsewhere = alreadyUsedBy && parseInt(alreadyUsedBy) !== activeCrumb.number;

                      return (
                        <button
                          key={hint.letter}
                          onClick={() => handleSelectAnswer(activeCrumb.number, hint.letter)}
                          className={`w-full text-left p-3 md:p-4 rounded-xl border-2 transition-all duration-200 flex gap-3 md:gap-4 items-start group
                            ${isCurrentSelection 
                              ? 'bg-emerald-50 border-emerald-500 shadow-md' 
                              : isUsedElsewhere 
                                ? 'bg-white border-slate-200 opacity-60 hover:opacity-100 hover:border-amber-400' 
                                : 'bg-white border-transparent shadow-sm hover:shadow-md hover:border-museum-gold'}`}
                        >
                          <div className={`w-8 h-8 md:w-10 md:h-10 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-sm md:text-base border-2 transition-colors
                            ${isCurrentSelection ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-100 text-slate-600 border-slate-200 group-hover:bg-museum-gold group-hover:text-white group-hover:border-museum-gold'}`}>
                            {hint.letter}
                          </div>
                          <div className="flex-grow pt-0.5 md:pt-1">
                            <p className={`text-sm md:text-base leading-snug md:leading-relaxed ${isCurrentSelection ? 'text-emerald-900 font-medium' : 'text-slate-700'}`}>
                              {hint.text}
                            </p>
                            {isUsedElsewhere && (
                              <div className="mt-2 inline-flex items-center gap-1.5 px-2 py-1 rounded bg-amber-100 text-amber-800 text-[10px] md:text-xs font-bold uppercase border border-amber-200">
                                <Icon path="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" className="w-3 h-3" />
                                Usado no Ponto {alreadyUsedBy} (Pode substituir)
                              </div>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- TELA 3: RESULTADOS ---------- */}
            {view === 'result' && resultData && (
              <div className="animate-fade-in space-y-6 md:space-y-8 max-w-4xl mx-auto py-4 md:py-8">
                
                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 text-center">
                  <div className="bg-museum-900 p-8 md:p-12 text-white relative">
                    <h2 className="text-3xl md:text-5xl font-serif font-bold mb-3 md:mb-4">Relatório de Desempenho</h2>
                    <p className="text-lg md:text-xl text-slate-300 font-light">
                      <span className="font-bold text-white">{studentData.name}</span> <span className="opacity-50 mx-2">|</span> {studentData.classRoom}
                    </p>
                  </div>
                  
                  <div className="p-6 md:p-10 flex flex-col sm:flex-row justify-center items-center gap-6 md:gap-12 bg-slate-50">
                    <div className="bg-white w-full sm:w-auto px-10 py-6 rounded-2xl shadow-md border-b-4 border-emerald-500">
                      <span className="block text-slate-500 font-bold uppercase tracking-wider text-xs md:text-sm mb-1">Nota / Acertos</span>
                      <span className="block text-5xl md:text-6xl font-black text-emerald-500">{resultData.hitPercentage}%</span>
                      <span className="block text-emerald-700 font-bold mt-2 text-sm">{resultData.correctCount} de {resultData.total} certos</span>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 className="text-xl md:text-2xl font-serif font-bold text-museum-900 mb-4 md:mb-6 px-2">Correção Detalhada</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                    {resultData.details.map((detail) => (
                      <div key={detail.crumbNumber} className={`bg-white rounded-xl p-4 md:p-5 shadow-sm border-l-4 md:border-l-8 ${detail.isCorrect ? 'border-emerald-500' : 'border-red-500'}`}>
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="font-bold text-slate-800 flex items-center gap-2 text-sm md:text-base">
                            <span className={`w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center text-white text-xs md:text-sm ${detail.isCorrect ? 'bg-emerald-500' : 'bg-red-500'}`}>
                              {detail.crumbNumber}
                            </span>
                            Marcador na Obra
                          </h4>
                          {detail.isCorrect ? (
                            <Icon path="M5 13l4 4L19 7" className="w-5 h-5 md:w-6 md:h-6 text-emerald-500" />
                          ) : (
                            <Icon path="M6 18L18 6M6 6l12 12" className="w-5 h-5 md:w-6 md:h-6 text-red-500" />
                          )}
                        </div>
                        
                        <div className="space-y-2">
                          <div className="bg-slate-50 px-3 py-2 rounded-lg border border-slate-100 flex justify-between items-center">
                            <span className="text-xs md:text-sm text-slate-500 font-bold">A sua Letra:</span>
                            <span className={`text-base md:text-lg font-black ${detail.isCorrect ? 'text-emerald-600' : 'text-red-600'}`}>{detail.userAnswer}</span>
                          </div>
                          {!detail.isCorrect && (
                            <div className="bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100 flex justify-between items-center">
                              <span className="text-xs md:text-sm text-emerald-800 font-bold">Letra Correta:</span>
                              <span className="text-base md:text-lg font-black text-emerald-600">{detail.correctAnswer}</span>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="text-center pt-6 pb-10">
                  <button onClick={() => window.location.reload()} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all inline-flex items-center gap-2">
                    <Icon path="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    Nova Tentativa / Outro Aluno
                  </button>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
