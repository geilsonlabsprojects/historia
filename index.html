<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade de História | Análise de Iconografia</title>
  
  <!-- Fontes Google - Mais limpas e compactas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuração do Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#0f766e',
              600: '#0f766e',
              900: '#134e4a',
            },
            accent: '#d97706',
          }
        }
      }
    }
  </script>
  
  <!-- React e Bibliotecas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #f1f5f9;
    }
    
    /* Scrollbar fina e compacta */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animações rápidas e subtis */
    .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .pin-pulse {
      box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.6);
      animation: pulse-pin 2s infinite;
    }
    @keyframes pulse-pin {
      0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(217, 119, 6, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SCHOOL_LOGO_URL = "https://i.ibb.co/Df0wxYjb/Design-sem-nome-5-removebg-preview.png";
    const IMAGE_URL = "https://i.ibb.co/RGtcdfVC/onhb.jpg";

    const hints = [
      { letter: 'A', text: 'Vemos antes embarcações que realizam uma Romaria Marítima, manifestação religiosa católica na qual fiéis percorrem rios ou o mar em barcos enfeitados.' },
      { letter: 'B', text: 'A vegetação é composta por árvores frondosas representadas de forma simétrica.' },
      { letter: 'C', text: 'Várias barracas são avistadas, provavelmente montadas para o conforto e descanso dos romeiros.' },
      { letter: 'D', text: 'Há três pessoas negras num barco e duas delas parecem executar uma apresentação com instrumentos de sopro.' },
      { letter: 'E', text: 'Há embarcações conduzidas por remadores brancos.' },
      { letter: 'F', text: 'Um grupo de homens negros desloca-se à frente de um grupo de homens a cavalo.' },
      { letter: 'G', text: 'Um homem desce um pequeno morro trazendo um objeto redondo nas suas mãos.' },
      { letter: 'H', text: 'Veículos de tração animal desatrelados são vistos na imagem.' },
      { letter: 'I', text: 'Um grupo de homens negros adestra cavalos de montaria.' }, 
      { letter: 'J', text: 'Todas as embarcações são conduzidas por remadores negros.' }, 
      { letter: 'K', text: 'Pessoas descansam junto a barracas, sob árvores e mesmo deitadas no chão.' },
      { letter: 'L', text: 'Ao fundo vêem-se colinas e montanhas.' },
      { letter: 'M', text: 'A obra “Romaria Marítima diante do Hospital dos Lázaros”, óleo sobre tela, 96 x 126 cm (oval), sem assinatura e sem data (provavelmente c.1790) é uma produção do pintor, cenógrafo e arquiteto Leandro Joaquim e pertence ao acervo do Museu Histórico Nacional.' },
      { letter: 'N', text: 'Embarcações apresentam tendas que têm a função de proteger os passageiros do sol, chuva e vento.' },
      { letter: 'O', text: 'Mulheres, provavelmente da elite, usam chapéus decorados com penas.' },
      { letter: 'P', text: 'Uma roda de moinho encontra-se próxima a uma construção e por elas passa um canal de água que deságua no mar.' },
      { letter: 'Q', text: 'Há embarcações maiores e ricamente decoradas e outras mais simples e menores.' },
      { letter: 'R', text: 'Identifica-se pessoas negras na imagem, especialmente homens a remar nas embarcações.' },
      { letter: 'S', text: 'Construções em alvenaria, edifícios e muros podem ser vistos entre a praia e o Hospital.' },
      { letter: 'T', text: 'Há grande número de bandeiras, especialmente brancas, vermelhas, brancas e vermelhas. Algumas trazem brasões.' },
      { letter: 'U', text: 'Pessoas protegem-se sob guarda-sóis.' },
      { letter: 'V', text: 'Pessoas aproximam-se do Hospital subindo aclives.' },
      { letter: 'W', text: 'Bandeiras são vistas tanto nas embarcações como em terra, especialmente nas cores verde e amarelo - cores da casa de Bragança.' }, 
      { letter: 'X', text: 'No alto de uma colina vê-se o Hospital dos Lázaros, um lazareto [instituição dedicada ao isolamento e tratamento de doentes com hanseníase].' },
      { letter: 'Y', text: 'Um jovem leva uma bola de couro para a festa que acontece mais abaixo.' }, 
      { letter: 'Z', text: 'Pode-se ver homens, mulheres e crianças na imagem, tanto nas embarcações como em terra.' }
    ];

    const officialAnswers = {
      1: 'M', 2: 'X', 3: 'A', 4: 'R', 5: 'C', 6: 'F', 7: 'Z', 8: 'H', 9: 'P', 10: 'K',
      11: 'L', 12: 'B', 13: 'Q', 14: 'D', 15: 'O', 16: 'E', 17: 'S', 18: 'T', 19: 'N',
      20: 'U', 21: 'V', 22: 'G'
    };

    const crumbsPositions = [
      { number: 1, left: 50.05, top: 9.54 }, { number: 2, left: 20.02, top: 28.97 },
      { number: 3, left: 50.05, top: 86.06 }, { number: 4, left: 64.94, top: 75.32 },
      { number: 5, left: 52.37, top: 45.16 }, { number: 6, left: 62.5, top: 37.49 },
      { number: 7, left: 42.24, top: 43.97 }, { number: 8, left: 38.82, top: 47.38 },
      { number: 9, left: 26.46, top: 48.88 }, { number: 10, left: 17.7, top: 47.38 },
      { number: 11, left: 44.68, top: 28.97 }, { number: 12, left: 33.3, top: 39.74 },
      { number: 13, left: 42.24, top: 73.07 }, { number: 14, left: 21.19, top: 71.95 },
      { number: 15, left: 21.29, top: 48.5 }, { number: 16, left: 13.11, top: 63.63 },
      { number: 17, left: 25.29, top: 42.84 }, { number: 18, left: 49.27, top: 72.39 },
      { number: 19, left: 46.92, top: 56.17 }, { number: 20, left: 57.13, top: 72.39 },
      { number: 21, left: 22.2, top: 36.12 }, { number: 22, left: 13.6, top: 46.9 }
    ];

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        user: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z",
        check: "M5 13l4 4L19 7",
        x: "M6 18L18 6M6 6l12 12",
        zoomIn: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7",
        zoomOut: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0113 10H7",
        chevronRight: "M9 5l7 7-7 7",
        send: "M12 19l9 2-9-18-9 18 9-2zm0 0v-8",
        warning: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z",
        list: "M4 6h16M4 10h16M4 14h16M4 18h16"
      };
      return (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={icons[name] || icons.check}></path>
        </svg>
      );
    };

    function App() {
      const [view, setView] = useState('login'); 
      const [errorBanner, setErrorBanner] = useState('');
      const [zoomScale, setZoomScale] = useState(1);
      
      const [studentData, setStudentData] = useState({ name: '', shift: '', classRoom: '' });
      const [answers, setAnswers] = useState({});
      const [activeCrumb, setActiveCrumb] = useState(null);
      const [resultData, setResultData] = useState(null);

      const handleStartQuiz = (e) => {
        e.preventDefault();
        if (studentData.name && studentData.shift && studentData.classRoom) {
          setErrorBanner('');
          setView('quiz');
          window.scrollTo(0, 0);
        }
      };

      const handleSelectAnswer = (crumbNumber, letter) => {
        const newAnswers = { ...answers };
        Object.keys(newAnswers).forEach(key => {
          if (newAnswers[key] === letter) delete newAnswers[key];
        });
        newAnswers[crumbNumber] = letter;
        setAnswers(newAnswers);
        setActiveCrumb(null);
      };

      const handleSubmitQuiz = () => {
        if (Object.keys(answers).length < crumbsPositions.length) {
          setErrorBanner(`Atenção: Preencheu ${Object.keys(answers).length} de ${crumbsPositions.length} marcadores. Conclua antes de submeter.`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        setErrorBanner('');
        
        let correctCount = 0;
        const details = crumbsPositions.map(crumb => {
          const userAnswer = answers[crumb.number];
          const correctAnswer = officialAnswers[crumb.number];
          const isCorrect = userAnswer === correctAnswer;
          if (isCorrect) correctCount++;
          return { crumbNumber: crumb.number, userAnswer, correctAnswer, isCorrect };
        });
        
        const hitPercentage = Math.round((correctCount / crumbsPositions.length) * 100);
        const results = { correctCount, total: crumbsPositions.length, hitPercentage, details };
        
        setResultData(results);
        setView('result');
        window.scrollTo(0, 0);
        
        if (results.hitPercentage >= 50) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      };

      const progressCount = Object.keys(answers).length;
      const progressPercent = Math.round((progressCount / crumbsPositions.length) * 100);

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* HEADER COMPACTO */}
          <header className="bg-white text-slate-800 shadow-sm border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-brand-50 p-1.5 rounded border border-brand-100">
                  <Icon name="list" className="w-5 h-5 text-brand-600" />
                </div>
                <div>
                  <h1 className="text-lg font-serif font-bold leading-tight">Análise Iconográfica</h1>
                  <p className="text-[10px] text-brand-600 font-bold uppercase tracking-wide">História</p>
                </div>
              </div>
              <img src={SCHOOL_LOGO_URL} alt="Logo" className="h-8 w-auto hidden sm:block" onError={(e) => e.target.style.display='none'} />
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-grow max-w-6xl mx-auto w-full p-3 md:p-4">
            
            {errorBanner && (
              <div className="mb-4 bg-red-50 border border-red-200 p-3 rounded-lg shadow-sm flex items-start gap-2 fade-enter">
                <Icon name="warning" className="w-5 h-5 text-red-500 flex-shrink-0" />
                <p className="text-red-800 text-sm font-medium">{errorBanner}</p>
              </div>
            )}

            {/* LOGIN */}
            {view === 'login' && (
              <div className="fade-enter flex items-center justify-center py-8">
                <div className="bg-white rounded-xl shadow-md border border-slate-200 p-6 max-w-md w-full">
                  <div className="text-center mb-6">
                    <h2 className="text-xl font-serif font-bold text-slate-900">Acesso à Atividade</h2>
                    <p className="text-slate-500 text-sm mt-1">Preencha os dados abaixo.</p>
                  </div>
                  
                  <form onSubmit={handleStartQuiz} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">NOME COMPLETO</label>
                      <input type="text" required value={studentData.name} onChange={(e) => setStudentData({...studentData, name: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-md focus:ring-1 focus:ring-brand-500 outline-none text-sm" placeholder="O seu nome..." />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">TURMA</label>
                        <input type="text" required value={studentData.classRoom} onChange={(e) => setStudentData({...studentData, classRoom: e.target.value})}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-md focus:ring-1 focus:ring-brand-500 outline-none text-sm" placeholder="Ex: 8º A" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">TURNO</label>
                        <select required value={studentData.shift} onChange={(e) => setStudentData({...studentData, shift: e.target.value})}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-md focus:ring-1 focus:ring-brand-500 outline-none text-sm">
                          <option value="">Selecione...</option>
                          <option value="Manhã">Manhã</option>
                          <option value="Tarde">Tarde</option>
                          <option value="Noite">Noite</option>
                        </select>
                      </div>
                    </div>
                    <button type="submit" className="w-full mt-4 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-md transition-colors flex justify-center items-center gap-2 text-sm">
                      Iniciar Atividade <Icon name="chevronRight" className="w-4 h-4" />
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* QUIZ */}
            {view === 'quiz' && (
              <div className="flex flex-col lg:flex-row gap-4 fade-enter">
                
                {/* ESQUERDA: IMAGEM */}
                <div className="w-full lg:w-[70%] flex flex-col gap-3">
                  <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-3 flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-serif font-bold text-slate-800">Romaria Marítima</h2>
                      <p className="text-xs text-slate-500">Associe os pontos à respetiva descrição.</p>
                    </div>
                    <div className="flex items-center bg-slate-100 p-1 rounded border border-slate-200">
                      <button onClick={() => setZoomScale(Math.max(1, zoomScale - 0.5))} className="p-1.5 hover:bg-white rounded" disabled={zoomScale <= 1}><Icon name="zoomOut" className="w-4 h-4" /></button>
                      <span className="px-2 text-xs font-bold text-slate-600">{Math.round(zoomScale * 100)}%</span>
                      <button onClick={() => setZoomScale(Math.min(3, zoomScale + 0.5))} className="p-1.5 hover:bg-white rounded" disabled={zoomScale >= 3}><Icon name="zoomIn" className="w-4 h-4" /></button>
                    </div>
                  </div>

                  <div className="bg-slate-900 rounded-lg shadow-sm overflow-hidden border-[4px] border-[#3e2723] relative">
                    <div className="overflow-auto w-full h-[50vh] lg:h-[65vh]">
                      <div className="relative transition-transform duration-200 origin-top-left" style={{ width: `${100 * zoomScale}%`, minWidth: '700px' }}>
                        <img src={IMAGE_URL} alt="Pintura" className="w-full h-auto block select-none pointer-events-none" draggable="false" />
                        
                        {crumbsPositions.map((crumb) => {
                          const isAnswered = !!answers[crumb.number];
                          const letter = answers[crumb.number];
                          return (
                            <button
                              key={crumb.number}
                              onClick={() => setActiveCrumb(crumb)}
                              className={`absolute flex items-center justify-center font-bold text-xs transition-transform transform -translate-x-1/2 -translate-y-1/2 hover:scale-110
                                ${isAnswered ? 'bg-brand-600 text-white border border-white shadow z-20' : 'bg-accent text-white border-2 border-white pin-pulse z-10'}`}
                              style={{ 
                                left: `${crumb.left}%`, top: `${crumb.top}%`,
                                width: `${Math.max(22, 30 / zoomScale)}px`, height: `${Math.max(22, 30 / zoomScale)}px`,
                                borderRadius: '50%'
                              }}
                            >
                              {isAnswered ? letter : crumb.number}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>

                {/* DIREITA: PAINEL */}
                <div className="w-full lg:w-[30%] flex flex-col gap-3">
                  
                  {/* Progresso */}
                  <div className="bg-white p-3 rounded-lg shadow-sm border border-slate-200">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-slate-500 uppercase">Progresso</span>
                      <span className="text-sm font-bold text-brand-600">{progressCount} / {crumbsPositions.length}</span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                      <div className="bg-brand-500 h-full rounded-full transition-all" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                  </div>

                  {/* Grelha */}
                  <div className="bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden max-h-[50vh] lg:max-h-[calc(65vh-40px)]">
                    <div className="bg-slate-50 px-3 py-2 border-b border-slate-200">
                      <h4 className="font-bold text-xs text-slate-700 flex items-center gap-1.5">
                        <Icon name="list" className="w-3.5 h-3.5 text-brand-500" />
                        Grelha
                      </h4>
                    </div>
                    <div className="p-2 overflow-y-auto">
                      <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-4 gap-1.5">
                        {crumbsPositions.map((crumb) => {
                          const isAnswered = !!answers[crumb.number];
                          return (
                            <button
                              key={crumb.number}
                              onClick={() => setActiveCrumb(crumb)}
                              className={`flex flex-col items-center justify-center py-1.5 px-1 rounded border transition-colors ${
                                isAnswered ? 'bg-brand-50 border-brand-200' : 'bg-white border-slate-200 hover:border-accent'
                              }`}
                            >
                              <span className="text-[9px] font-bold text-slate-400">P{crumb.number}</span>
                              <span className={`text-sm font-black leading-none mt-0.5 ${isAnswered ? 'text-brand-700' : 'text-slate-300'}`}>
                                {isAnswered ? answers[crumb.number] : '-'}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* Botão Submeter */}
                  <button 
                    onClick={handleSubmitQuiz}
                    disabled={progressCount < crumbsPositions.length}
                    className={`w-full py-3 rounded-lg font-bold text-sm flex justify-center items-center gap-2 transition-colors mt-auto
                      ${progressCount < crumbsPositions.length 
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                        : 'bg-slate-800 text-white hover:bg-slate-900 shadow-md'}`}
                  >
                    <Icon name="send" className="w-4 h-4" /> Submeter Atividade
                  </button>

                </div>
              </div>
            )}

            {/* MODAL */}
            {activeCrumb && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 fade-enter">
                <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={() => setActiveCrumb(null)}></div>
                
                <div className="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[80vh] flex flex-col relative z-10 overflow-hidden">
                  <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <div className="bg-brand-100 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm text-brand-700">
                        {activeCrumb.number}
                      </div>
                      <h4 className="text-sm font-bold text-slate-800">Selecione a Descrição</h4>
                    </div>
                    <button onClick={() => setActiveCrumb(null)} className="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-200">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="overflow-y-auto p-3 space-y-2 flex-grow">
                    {hints.map((hint) => {
                      const alreadyUsedBy = Object.keys(answers).find(key => answers[key] === hint.letter);
                      const isCurrentSelection = answers[activeCrumb.number] === hint.letter;
                      const isUsedElsewhere = alreadyUsedBy && parseInt(alreadyUsedBy) !== activeCrumb.number;

                      return (
                        <button
                          key={hint.letter}
                          onClick={() => handleSelectAnswer(activeCrumb.number, hint.letter)}
                          className={`w-full text-left p-2.5 rounded-lg border flex gap-3 items-start transition-colors
                            ${isCurrentSelection ? 'bg-brand-50 border-brand-500' : isUsedElsewhere ? 'bg-white border-slate-100 opacity-50 hover:opacity-100' : 'bg-white border-slate-200 hover:border-brand-300'}`}
                        >
                          <div className={`w-6 h-6 rounded flex-shrink-0 flex items-center justify-center font-bold text-xs
                            ${isCurrentSelection ? 'bg-brand-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                            {hint.letter}
                          </div>
                          <div className="flex-grow">
                            <p className={`text-[13px] leading-tight ${isCurrentSelection ? 'text-brand-900 font-medium' : 'text-slate-600'}`}>{hint.text}</p>
                            {isUsedElsewhere && (
                              <div className="mt-1.5 inline-block px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 text-[10px] font-bold">
                                Usado no Ponto {alreadyUsedBy}
                              </div>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* RESULTADOS FINAIS */}
            {view === 'result' && resultData && (
              <div className="fade-enter max-w-2xl mx-auto py-6">
                
                <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                  <div className={`p-6 text-center ${resultData.hitPercentage >= 50 ? 'bg-brand-600' : 'bg-slate-800'} text-white`}>
                    <h2 className="text-2xl font-serif font-bold">Resultado Final</h2>
                    <p className="text-sm opacity-90">{studentData.name} • {studentData.classRoom}</p>
                    
                    <div className="mt-6 bg-white w-24 h-24 rounded-full mx-auto flex items-center justify-center shadow-lg text-slate-900">
                       <span className={`text-3xl font-black ${resultData.hitPercentage >= 50 ? 'text-brand-500' : 'text-red-500'}`}>
                         {resultData.hitPercentage}%
                       </span>
                    </div>
                  </div>

                  <div className="p-6 text-center">
                    <p className="text-slate-600 mb-5 text-sm">
                      Teve <strong className="text-slate-900">{resultData.correctCount}</strong> acertos de <strong className="text-slate-900">{resultData.total}</strong> pontos possíveis.
                    </p>
                    <button onClick={() => window.location.reload()} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-6 rounded-lg text-sm transition-colors border border-slate-200">
                      Sair / Novo Aluno
                    </button>
                  </div>
                </div>

                <div className="mt-6 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                  <h3 className="font-bold text-slate-800 mb-3 text-sm">Gabarito Completo:</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                    {resultData.details.map((detail) => (
                      <div key={detail.crumbNumber} className={`flex flex-col p-2.5 rounded-md border text-xs ${detail.isCorrect ? 'bg-brand-50 border-brand-200' : 'bg-red-50 border-red-200'}`}>
                        <span className="font-bold text-slate-500 mb-1">Ponto {detail.crumbNumber}</span>
                        
                        <div className="flex flex-col gap-0.5">
                           <span className={`font-semibold ${detail.isCorrect ? 'text-brand-700' : 'text-red-600'}`}>
                             Sua resp: <strong className="font-black">{detail.userAnswer}</strong>
                           </span>
                           
                           {/* Mostra a resposta correta APENAS se o aluno tiver errado */}
                           {!detail.isCorrect && (
                             <span className="text-[10px] text-green-700 font-semibold mt-1">
                               Correta: <strong className="font-black">{detail.correctAnswer}</strong>
                             </span>
                           )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
